[project]
name = "textsaver"
version = "0.1.0"
description = "Omarchy-style terminal text-effect screensaver for Windows Terminal"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyfiglet>=1.0.4",
    "terminaltexteffects>=0.15.0",
]

[project.scripts]
textsaver = "textsaver.cli:main"

[project.gui-scripts]
textsaver-scr = "textsaver.cli:scr_main"

[build-system]
requires = ["uv_build>=0.9.2,<0.10"]
build-backend = "uv_build"
